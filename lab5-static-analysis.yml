name: Lab 5 Static Analysis

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "LAB5_PES1UG25CS812/pos_system.py"
      - "LAB5_PES1UG25CS812/pos_system_before.py"
      - "LAB5_PES1UG25CS812/tests/**"
      - "LAB5_PES1UG25CS812/requirements.txt"
      - "LAB5_PES1UG25CS812/run_analysis.py"
      - "LAB5_PES1UG25CS812/generate_report.py"
      - ".github/workflows/lab5-static-analysis.yml"

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LAB5_PES1UG25CS812
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install analysis and PDF tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Generate before-and-after reports
        run: python run_analysis.py

      - name: Generate PDF report
        run: python generate_report.py

      - name: Commit generated reports and PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pylint_report_before.txt pylint_report_after.txt bandit_report_before.txt bandit_report_after.txt flake8_report_before.txt flake8_report_after.txt LAB5_PES1UG25CS812_Report.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Add Lab 5 static analysis reports and PDF"
            git push origin HEAD:main
          else
            echo "Reports and PDF are already up to date."
          fi
